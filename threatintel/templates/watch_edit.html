{% extends "base.html" %}
{% block title %}Edit note{% endblock %}
{% block content %}
  <h1>Note for {{ watch.vulnerability.cve_id }}</h1>
  <form method="post">
    {% csrf_token %}
    {{ form }}
    <button type="submit" class="btn btn-primary mt-2">Save</button>
    <a class="btn btn-link mt-2" href="/watchlist/">Cancel</a>
  </form>
{% endblock %}
